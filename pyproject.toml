[project]
name = "jupus"
version = "0.1.0"
description = "Inbound voice agent for a law firm — Voice AI Engineer take-home"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "anthropic>=0.34",
    "openai>=1.45",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
include = ["backend*", "eval*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
