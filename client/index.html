<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jupus — Voice Intake</title>
  <style>
    :root {
      --bg: #0a0c10;
      --panel: #12151c;
      --panel-2: #171b23;
      --border: #262b35;
      --text: #e7eaf0;
      --text-dim: #8891a0;
      --text-faint: #565f6e;
      --accent: #6366f1;
      --accent-glow: #818cf8;
      --cyan: #22d3ee;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
      margin: 0;
      background: radial-gradient(circle at 50% -10%, #171d2c 0%, var(--bg) 55%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    main { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 18px; }

    .brand { text-align: center; margin-bottom: 4px; }
    .brand .mark {
      width: 40px; height: 40px; border-radius: 11px; margin: 0 auto 10px;
      background: linear-gradient(135deg, var(--cyan), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; font-weight: 700; color: #05070a;
    }
    .brand h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
    .brand .subtitle { font-size: 12.5px; color: var(--text-faint); margin-top: 3px; }

    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 28px 26px; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }

    #stage {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }

    #orb-wrap { position: relative; width: 190px; height: 190px; }
    canvas#orb { width: 190px; height: 190px; display: block; }
    #orb-icon {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 650; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
      pointer-events: none; text-align: center; padding: 0 30px; white-space: pre-line;
      transition: color 0.3s ease;
    }
    #orb-icon.state-caller { color: var(--cyan); }
    #orb-icon.state-agent { color: var(--accent-glow); }
    #orb-icon.state-connecting { color: var(--amber); }

    #status-row { display: flex; align-items: center; gap: 8px; }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); transition: background 0.3s ease; }
    #status-dot.pulsing { animation: pulse-dot 1.1s ease-in-out infinite; }
    #status-dot.connected { background: var(--green); }
    #status-dot.connecting { background: var(--amber); }
    #status-dot.error { background: var(--red); }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    #status-text { font-size: 13.5px; color: var(--text-dim); font-weight: 550; text-transform: capitalize; }

    #call-id-chip {
      font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; color: var(--text-faint);
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 12px; cursor: pointer; user-select: text;
    }
    #call-id-chip:hover { color: var(--text-dim); border-color: #3a4150; }
    #call-id-chip.hidden { display: none; }

    .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
    button {
      font-family: inherit; font-size: 13.5px; font-weight: 650; padding: 11px 26px;
      border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    #start-call { background: var(--accent); color: #fff; border-color: transparent; }
    #start-call:hover:not(:disabled) { background: #5457e0; }
    #end-call { background: var(--panel-2); color: var(--red); border-color: #4a2a2a; }
    #end-call:hover:not(:disabled) { background: #201217; }

    .panel-title {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-faint); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .panel-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    #fields-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .field-tile {
      background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 10px 12px; transition: border-color 0.3s ease, background 0.3s ease;
    }
    .field-tile .field-label {
      display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin-bottom: 5px;
    }
    .field-tile .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
    .field-tile .field-value { font-size: 12.5px; color: var(--text-dim); word-break: break-word; min-height: 16px; }
    .field-tile.status-pending_confirm { border-color: #5a4a10; background: #211c0a; }
    .field-tile.status-pending_confirm .dot { background: var(--amber); box-shadow: 0 0 0 3px rgba(251,191,36,0.18); }
    .field-tile.status-pending_confirm .field-value { color: var(--amber); }
    .field-tile.status-confirmed { border-color: #1f5a3d; background: #0e1f18; }
    .field-tile.status-confirmed .dot { background: var(--green); }
    .field-tile.status-confirmed .field-value { color: var(--text); }

    #transcript { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
    .transcript-turn { padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.5; max-width: 82%; }
    .transcript-turn.caller { background: #16233a; color: #cfe8f5; margin-right: auto; border-bottom-left-radius: 4px; }
    .transcript-turn.agent { background: var(--panel-2); color: var(--text); margin-left: auto; border-bottom-right-radius: 4px; }
    .transcript-turn.thinking { background: var(--panel-2); color: var(--text-faint); margin-left: auto; font-style: italic; border-bottom-right-radius: 4px; }
    #transcript::-webkit-scrollbar { width: 7px; }
    #transcript::-webkit-scrollbar-thumb { background: #2b3140; border-radius: 4px; }
    .empty-transcript { color: var(--text-faint); font-size: 12.5px; text-align: center; padding: 20px 0; }

    audio { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark">J</div>
      <h1>Jupus — Law Firm Voice Intake</h1>
      <div class="subtitle">Routing · booking · escalation, handled live by voice</div>
    </div>

    <div class="card" id="stage">
      <div id="orb-wrap">
        <canvas id="orb" width="190" height="190"></canvas>
        <div id="orb-icon">Press start<br>to begin</div>
      </div>
      <div id="status-row">
        <span id="status-dot"></span>
        <span id="status-text">idle</span>
      </div>
      <span id="call-id-chip" class="hidden" title="Copy — paste into the Live Supervisor page to watch this call"></span>
      <div class="buttons">
        <button id="start-call">Start Call</button>
        <button id="end-call" disabled>End Call</button>
      </div>
    </div>

    <div class="card">
      <div class="panel-title">Captured details</div>
      <div id="fields-grid">
        <div class="field-tile" data-field="name">
          <div class="field-label"><span class="dot"></span>Name</div>
          <div class="field-value">—</div>
        </div>
        <div class="field-tile" data-field="email">
          <div class="field-label"><span class="dot"></span>Email</div>
          <div class="field-value">—</div>
        </div>
        <div class="field-tile" data-field="phone">
          <div class="field-label"><span class="dot"></span>Phone</div>
          <div class="field-value">—</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="panel-title">Live transcript</div>
      <div id="transcript"><div class="empty-transcript">Nothing said yet.</div></div>
    </div>
  </main>
  <audio id="remote-audio" autoplay></audio>
  <script src="app.js"></script>
</body>
</html>
