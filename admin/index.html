<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jupus — Admin</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e6e8ec;
    --border-strong: #d8dbe1;
    --text: #14171c;
    --text-dim: #6b7280;
    --text-faint: #9aa1ab;
    --accent: #4338ca;
    --accent-soft: #eef0ff;
    --header-bg: #101216;
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 2px 8px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    font-variant-numeric: tabular-nums;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    padding: 13px 28px;
    background: var(--header-bg);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 3;
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand .mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, #6366f1, #4338ca);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: 0.01em; }
  header .subtitle { font-size: 11.5px; color: #9299a6; font-weight: 400; margin-top: 1px; }
  header a {
    display: inline-flex; align-items: center; gap: 6px;
    color: #d7dbfa;
    font-size: 12.5px;
    font-weight: 500;
    text-decoration: none;
    padding: 7px 13px;
    border-radius: 7px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.09);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  header a:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.16); }
  header .header-right { display: flex; align-items: center; gap: 16px; }

  /* ---------- Tab nav ---------- */
  #tabnav { display: flex; gap: 4px; background: var(--panel); border-bottom: 1px solid var(--border); padding: 0 28px; }
  #tabnav button {
    border: none; background: transparent; cursor: pointer;
    padding: 12px 6px; margin: 0 14px 0 0; font-size: 13px; font-weight: 600; color: var(--text-faint);
    border-bottom: 2px solid transparent; transition: color 0.12s ease, border-color 0.12s ease;
  }
  #tabnav button:hover { color: var(--text); }
  #tabnav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  #tabnav button .tab-badge {
    display: inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 700; color: #8a6400;
    background: #fef1cd; padding: 1px 6px; border-radius: 999px;
  }

  /* ---------- Views ---------- */
  #view-calls, #view-insights { flex: 1; min-height: 0; }
  #view-calls { display: flex; }
  #view-insights { overflow-y: auto; padding: 24px 28px 40px; }
  .hidden { display: none !important; }

  .insights-title { margin: 4px 0 16px; font-size: 15px; font-weight: 650; color: var(--text); }

  #summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card {
    flex: 1 1 130px;
    min-width: 130px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    box-shadow: var(--shadow-sm);
  }
  .stat-card .label {
    display: block; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 6px;
  }
  .stat-card .value { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; color: var(--text); line-height: 1; }
  .stat-card .value .unit { font-size: 13px; font-weight: 500; color: var(--text-dim); margin-left: 2px; }
  .stat-card.accent-good .value { color: #15803d; }

  .breakdown-card {
    flex: 1 1 260px;
    min-width: 260px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    box-shadow: var(--shadow-sm);
  }
  .breakdown-card .label {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 8px; display: block;
  }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 12px; color: var(--text);
  }
  .chip .n { font-weight: 700; color: var(--accent); }
  .chip.empty { color: var(--text-faint); border-style: dashed; }

  /* ---------- Taxonomy suggestions ---------- */
  .taxonomy-card {
    background: #fffdf7; border: 1px solid #f0dfa8; border-radius: var(--radius-md);
    padding: 14px 18px; box-shadow: var(--shadow-sm);
  }
  .taxonomy-card .taxonomy-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    font-size: 12.5px; font-weight: 700; color: #8a6400; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .taxonomy-card .taxonomy-head .dot { width: 7px; height: 7px; border-radius: 50%; background: #d9a300; }
  .suggestion-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 13px; }
  .suggestion-row:last-child { border-bottom: none; }
  .suggestion-row .suggestion-text { color: var(--text); }
  .suggestion-row .suggestion-text .tag {
    display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.03em; background: #fff0c2; color: #8a6400; padding: 1px 7px; border-radius: 5px; margin-right: 6px;
  }
  .suggestion-row .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .suggestion-row button {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; transition: background 0.12s ease;
  }
  .suggestion-row button.approve-suggestion { color: #15803d; border-color: #bfe6c8; }
  .suggestion-row button.approve-suggestion:hover { background: #f1fbf3; }
  .suggestion-row button.reject-suggestion { color: #b3261e; border-color: #f3c8c4; }
  .suggestion-row button.reject-suggestion:hover { background: #fef4f3; }

  #calls-panel { width: 520px; flex-shrink: 0; overflow-y: auto; overflow-x: hidden; border-right: 1px solid var(--border); background: var(--panel); }
  #detail-panel { flex: 1; overflow-y: auto; padding: 28px 36px; }

  #calls-panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--panel); z-index: 1;
  }
  #calls-panel-head .title { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  #calls-panel-head .count { font-size: 11.5px; font-weight: 600; color: var(--text-faint); background: var(--bg); padding: 2px 8px; border-radius: 999px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  thead th {
    text-align: left;
    padding: 9px 14px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.045em;
    color: var(--text-faint);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 41px;
  }
  th:nth-child(1) { width: 24%; }
  th:nth-child(2) { width: 14%; }
  th:nth-child(3) { width: 19%; }
  th:nth-child(4) { width: 35%; }
  th:nth-child(5) { width: 8%; text-align: center; }
  td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; overflow: hidden; }
  td:nth-child(5) { text-align: center; }
  tr.call-row { cursor: pointer; transition: background 0.1s ease; }
  tr.call-row:hover { background: #f9fafc; }
  tr.call-row.selected { background: var(--accent-soft); }
  tr.call-row.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  tr.call-row td:first-child { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--text-dim); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  tr.call-row td:nth-child(2) { color: var(--text-dim); font-size: 12.5px; text-transform: capitalize; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 650; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.9; }
  .badge.booked { background: #e3f8e7; color: #16803d; }
  .badge.escalated { background: #fde8de; color: #c2410c; }
  .badge.info_only { background: #eceef1; color: #52565c; }
  .badge.abandoned { background: #f5e6f8; color: #862d94; }

  .error-badge { display: inline-block; padding: 2px 8px; margin: 1px 4px 3px 0; border-radius: 999px; font-size: 10px; font-weight: 650; background: #fef1cd; color: #8a6400; white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
  .no-errors { color: var(--text-faint); font-size: 12px; }

  .reviewed-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .reviewed-dot.yes { background: #2ea043; box-shadow: 0 0 0 3px #e3f8e7; }
  .reviewed-dot.no { background: var(--border-strong); }

  /* ---------- Detail panel ---------- */
  #detail-panel h2 { margin: 0 0 18px; font-size: 19px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 650; letter-spacing: -0.01em; }
  #detail-panel h3 {
    margin: 26px 0 12px; font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.045em; color: var(--text-faint); display: flex; align-items: center; gap: 8px;
  }
  #detail-panel h3::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .meta-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 4px 20px; box-shadow: var(--shadow-sm); display: flex; flex-wrap: wrap;
  }
  .meta-item { padding: 12px 20px 12px 0; margin-right: 20px; border-right: 1px solid var(--border); }
  .meta-item:last-child { border-right: none; margin-right: 0; }
  .meta-item .k { display: block; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin-bottom: 3px; }
  .meta-item .v { font-size: 13.5px; font-weight: 550; color: var(--text); }

  .flag-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .flag-list li {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid #e0b000;
    border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; line-height: 1.5;
  }
  .flag-list li strong { font-family: ui-monospace, monospace; font-size: 12px; background: #fef1cd; color: #8a6400; padding: 1px 6px; border-radius: 5px; }
  .flag-list li .meta { color: var(--text-faint); font-size: 11.5px; }
  .flag-list.none-flagged { color: var(--text-faint); font-style: italic; font-size: 13px; }

  .review-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 18px; box-shadow: var(--shadow-sm); }
  .review-card.empty { color: var(--text-faint); font-style: italic; font-size: 13px; padding: 16px 18px; }
  .review-card .gold-tag { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; background: #fef1cd; color: #8a6400; padding: 2px 7px; border-radius: 5px; margin-left: 8px; letter-spacing: 0.03em; }
  .review-card ul { margin: 10px 0 0; padding-left: 18px; font-size: 13px; color: var(--text-dim); }

  #transcript { display: flex; flex-direction: column; gap: 8px; }
  .transcript-turn { padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; max-width: 78%; }
  .transcript-turn.caller { background: var(--accent-soft); margin-right: auto; border-bottom-left-radius: 4px; }
  .transcript-turn.agent { background: #f1f2f5; margin-left: auto; border-bottom-right-radius: 4px; }
  .transcript-turn .role { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin-bottom: 3px; }

  #trace-toggle {
    margin: 22px 0 10px;
    padding: 8px 16px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  #trace-toggle:hover { background: var(--bg); }
  #trace-view { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--panel); box-shadow: var(--shadow-sm); }
  .trace-event { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; padding: 7px 12px; border-bottom: 1px solid var(--border); }
  .trace-event:last-child { border-bottom: none; }
  .trace-event:nth-child(odd) { background: #fbfbfc; }
  .trace-event .seq { color: var(--text-faint); margin-right: 8px; }
  .trace-event .event-type { font-weight: 700; margin-right: 8px; color: var(--text); }
  .trace-event .node { color: var(--accent); margin-right: 8px; font-weight: 600; }
  .trace-event .payload { color: var(--text-dim); }

  .empty-state { color: var(--text-faint); padding: 80px 20px; text-align: center; font-size: 14px; }

  /* scrollbars */
  #calls-panel::-webkit-scrollbar, #detail-panel::-webkit-scrollbar { width: 9px; }
  #calls-panel::-webkit-scrollbar-thumb, #detail-panel::-webkit-scrollbar-thumb { background: #d8dbe1; border-radius: 5px; border: 2px solid var(--bg); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">J</div>
    <div>
      <h1>Jupus Admin</h1>
      <div class="subtitle">Call review &amp; evaluation console</div>
    </div>
  </div>
  <div class="header-right">
    <a href="/admin/graph.html">Live supervisor →</a>
    <a href="/admin/annotate">Benevolent Dictator queue →</a>
  </div>
</header>
<nav id="tabnav">
  <button type="button" class="active" data-view="calls">Calls</button>
  <button type="button" data-view="insights">Insights<span class="tab-badge hidden" id="insights-badge"></span></button>
</nav>
<main id="view-calls">
  <div id="calls-panel">
    <div id="calls-panel-head">
      <span class="title">Calls</span>
      <span class="count" id="calls-count"></span>
    </div>
    <table id="calls-table"><thead>
      <tr><th>Call</th><th>Area</th><th>Outcome</th><th>Errors</th><th title="Reviewed">Rev.</th></tr>
    </thead><tbody id="calls-tbody"></tbody></table>
  </div>
  <div id="detail-panel"><div class="empty-state">Select a call on the left to view its transcript.</div></div>
</main>
<div id="view-insights" class="hidden">
  <h2 class="insights-title">Evaluation summary</h2>
  <div id="summary"></div>
  <div id="taxonomy-panel"></div>
</div>
<script src="/admin/app.js"></script>
</body>
</html>
