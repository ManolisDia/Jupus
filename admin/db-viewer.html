<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jupus — DB Viewer</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e6e8ec;
    --border-strong: #d8dbe1;
    --text: #14171c;
    --text-dim: #6b7280;
    --text-faint: #9aa1ab;
    --accent: #4338ca;
    --accent-soft: #eef0ff;
    --header-bg: #101216;
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    font-variant-numeric: tabular-nums;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 13px 28px;
    background: var(--header-bg);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand .mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, #6366f1, #4338ca);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: 0.01em; }
  header .subtitle { font-size: 11.5px; color: #9299a6; font-weight: 400; margin-top: 1px; }
  header a {
    display: inline-flex; align-items: center; gap: 6px;
    color: #d7dbfa; font-size: 12.5px; font-weight: 500; text-decoration: none;
    padding: 7px 13px; border-radius: 7px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.09);
  }
  header a:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.16); }

  main { flex: 1; min-height: 0; display: flex; }

  #tables-panel { width: 220px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--border); background: var(--panel); padding: 12px 0; }
  #tables-panel .title { padding: 0 16px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
  #tables-list button {
    display: block; width: 100%; text-align: left; border: none; background: transparent; cursor: pointer;
    padding: 8px 16px; font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--text);
    border-left: 3px solid transparent;
  }
  #tables-list button:hover { background: var(--bg); }
  #tables-list button.active { background: var(--accent-soft); border-left-color: var(--accent); color: var(--accent); font-weight: 600; }

  #table-view { flex: 1; overflow: auto; padding: 20px 28px 40px; }
  #table-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  #table-head h2 { margin: 0; font-size: 16px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 650; }
  #table-head .count { font-size: 12px; color: var(--text-faint); }
  #table-head .pager { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  #table-head .pager button {
    border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 5px 10px;
    cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text);
  }
  #table-head .pager button:disabled { opacity: 0.4; cursor: default; }
  #table-head .pager button:not(:disabled):hover { background: var(--bg); }

  .table-scroll { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: auto; background: var(--panel); box-shadow: var(--shadow-sm); max-height: calc(100vh - 190px); }
  table { border-collapse: collapse; font-size: 12.5px; width: max-content; min-width: 100%; }
  thead th {
    text-align: left; padding: 9px 14px; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--text-faint); background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; white-space: nowrap;
  }
  td {
    text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: top;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; max-width: 420px; overflow-wrap: anywhere;
  }
  tbody tr:hover { background: #fbfbfc; }
  td.null { color: var(--text-faint); font-style: italic; }

  .empty-state { color: var(--text-faint); padding: 60px 20px; text-align: center; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">J</div>
    <div>
      <h1>Jupus Admin</h1>
      <div class="subtitle">Raw DB viewer (read-only)</div>
    </div>
  </div>
  <a href="/admin/">&larr; Back to calls</a>
</header>
<main>
  <div id="tables-panel">
    <div class="title">Tables</div>
    <div id="tables-list"></div>
  </div>
  <div id="table-view"><div class="empty-state">Select a table on the left.</div></div>
</main>
<script src="/admin/db-viewer.js"></script>
</body>
</html>
